<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Jarvis AI</title>
  <link rel="manifest" href="manifest-Jarvis.json">
  <meta name="theme-color" content="#0f0f15">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    :root { --bg-color: #0f0f15; --surface-color: #1a1b26; --primary-color: #4a9eff; --text-main: #e2e8f0; --text-muted: #94a3b8; --user-msg-bg: #2a3142; --ai-msg-bg: #1e1e2e; }
    body { background-color: var(--bg-color); color: var(--text-main); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
    
    svg { stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    
    /* ===== Header ===== */
    .header { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background-color: var(--bg-color); border-bottom: 1px solid #1f2937; z-index: 10; flex-shrink: 0; }
    .header h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; color: #ffffff; display: flex; align-items: center; gap: 8px; }
    .header-buttons { display: flex; gap: 15px; align-items: center; }
    .header-buttons button { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 5px; display: flex; justify-content: center; align-items: center; transition: color 0.2s; }
    .header-buttons button:hover { color: #ffffff; }
    .header-buttons svg { width: 20px; height: 20px; }
    
    /* ===== Chat Container ===== */
    .chat-container { flex: 1; min-height: 0; overflow-y: auto; padding: 20px; padding-bottom: 30px; display: flex; flex-direction: column; gap: 24px; scroll-behavior: smooth; }
    .message { display: flex; gap: 12px; max-width: 90%; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    
    /* 🟢 Premium Avatars */
    .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; flex-shrink: 0; font-weight: bold; }
    .ai .avatar { background: linear-gradient(135deg, #8b5cf6, #3b82f6); box-shadow: 0 0 12px rgba(139, 92, 246, 0.4); border: 1px solid #a78bfa; color: white; }
    .ai .avatar svg { width: 18px; height: 18px; }
    .user .avatar { background: #1a1b26; border: 1px solid #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.2); color: #4a9eff; }
    .user .avatar svg { width: 18px; height: 18px; }
    
    .message-content { padding: 12px 16px; border-radius: 14px; font-size: 15px; line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; }
    .user .message-content { background-color: var(--user-msg-bg); border-bottom-right-radius: 4px; }
    .ai .message-content { background-color: var(--ai-msg-bg); border: 1px solid #2a3142; border-bottom-left-radius: 4px; }
    .ai .message-content code { background-color: #0f1419; padding: 2px 6px; border-radius: 4px; font-family: monospace; color: #00e5ff; }
    
    .chat-image { max-width: 100%; border-radius: 8px; margin-bottom: 8px; display: block; border: 1px solid #2a3142; }

    /* ===== Image Preview Area ===== */
    #imagePreviewContainer { display: none; padding: 10px 15px; background-color: var(--surface-color); border-top: 1px solid #1f2937; align-items: center; gap: 10px; }
    #imagePreview { height: 60px; width: 60px; object-fit: cover; border-radius: 8px; border: 1px solid #2a3142; }
    .remove-img-btn { background: #ff6b4a; color: white; border: none; border-radius: 50%; width: 24px; height: 24px; font-size: 14px; cursor: pointer; display: flex; justify-content: center; align-items: center; }

    /* ===== Input Area ===== */
    .input-area { padding: 10px 15px; padding-bottom: max(10px, env(safe-area-inset-bottom, 15px)); background-color: var(--bg-color); flex-shrink: 0; }
    .input-box { background-color: var(--surface-color); border: 1px solid #2a3142; border-radius: 20px; padding: 8px 12px; display: flex; align-items: flex-end; gap: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .input-box textarea { flex: 1; background: none; border: none; color: var(--text-main); font-size: 15px; resize: none; max-height: 100px; outline: none; padding-top: 8px; line-height: 1.4; }
    .input-box textarea::placeholder { color: var(--text-muted); }
    
    .action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 5px; display: flex; justify-content: center; align-items: center; transition: all 0.2s; margin-bottom: 2px; }
    .action-btn:hover { color: var(--text-main); }
    .action-btn svg { width: 20px; height: 20px; }
    
    .voice-active { color: #ff6b4a; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    
    .send-btn { background: #4a9eff; color: white; border-radius: 50%; width: 34px; height: 34px; display: flex; justify-content: center; align-items: center; border: none; cursor: pointer; transition: 0.2s; margin-bottom: 2px; }
    .send-btn svg { width: 16px; height: 16px; stroke-width: 2.5; fill: currentColor; stroke: none; }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .typing-dots { display: flex; gap: 4px; align-items: center; height: 20px; }
    .typing-dots span { width: 5px; height: 5px; background-color: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
    .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
    .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
  </style>
</head>
<body>
  <div class="header">
    <h1>Jarvis AI</h1>
    <div class="header-buttons">
      <button id="voiceOutputBtn" title="Toggle Voice Output">
        <svg id="speakerIcon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
      </button>
      <button id="settingsBtn" title="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </div>
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="message ai">
      <div class="avatar">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
      </div>
      <div class="message-content">Hello Sir. I am your new Jarvis. I can help you with Coding, Writing, and general questions. You can also send me images! <br><br>How may I assist you today?</div>
    </div>
  </div>

  <div id="imagePreviewContainer">
    <img id="imagePreview" src="" alt="Preview">
    <button class="remove-img-btn" id="removeImageBtn">✕</button>
  </div>

  <div class="input-area">
    <div class="input-box">
      <button class="action-btn" id="imageBtn" title="Attach Image">
        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
      </button>
      <input type="file" id="imageInput" accept="image/*" style="display: none;">
      
      <button class="action-btn" id="voiceBtn" title="Voice Input">
        <svg id="micIcon" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
      </button>
      
      <textarea id="chatInput" rows="1" placeholder="Message Jarvis..."></textarea>
      
      <button class="send-btn" id="sendBtn">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </div>

  <div id="settingsModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(5px);">
    <div style="background: var(--surface-color); padding: 25px; border-radius: 15px; width: 100%; max-width: 400px; border: 1px solid #2a3142;">
      <h2 style="margin-bottom: 15px; color: white; font-size: 18px;">Settings</h2>
      <label style="display: block; color: var(--text-muted); margin-bottom: 5px; font-size: 14px;">Groq API Key:</label>
      <input type="password" id="apiKeyInput" placeholder="gsk_..." style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #2a3142; background: #0f1419; color: white; margin-bottom: 20px;">
      <div style="display: flex; gap: 10px;">
        <button id="cancelSettings" style="flex: 1; padding: 12px; border-radius: 8px; border: none; background: #2a3142; color: white; font-weight: bold; cursor: pointer;">Cancel</button>
        <button id="saveSettings" style="flex: 1; padding: 12px; border-radius: 8px; border: none; background: #4a9eff; color: white; font-weight: bold; cursor: pointer;">Save</button>
      </div>
    </div>
  </div>

  <script>
    const chatContainer = document.getElementById('chatContainer');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveSettingsBtn = document.getElementById('saveSettings');
    const cancelSettingsBtn = document.getElementById('cancelSettings');
    
    const imageBtn = document.getElementById('imageBtn');
    const imageInput = document.getElementById('imageInput');
    const imagePreviewContainer = document.getElementById('imagePreviewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const removeImageBtn = document.getElementById('removeImageBtn');
    const voiceOutputBtn = document.getElementById('voiceOutputBtn');
    const speakerIcon = document.getElementById('speakerIcon');
    const micIcon = document.getElementById('micIcon');

    let apiKey = localStorage.getItem('jarvis_groq_key') || "";
    let isVoiceInputActive = false;
    let isVoiceOutputEnabled = false;
    let attachedImageBase64 = null;
    let chatHistory = []; 
    
    chatInput.addEventListener('focus', () => {
      setTimeout(() => { chatContainer.scrollTop = chatContainer.scrollHeight; }, 300); 
    });

    voiceOutputBtn.addEventListener('click', () => {
      isVoiceOutputEnabled = !isVoiceOutputEnabled;
      if(isVoiceOutputEnabled) {
        speakerIcon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>`;
        voiceOutputBtn.style.color = '#4a9eff';
      } else {
        speakerIcon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>`;
        voiceOutputBtn.style.color = 'var(--text-muted)';
        window.speechSynthesis.cancel();
      }
    });

    imageBtn.addEventListener('click', () => { imageInput.click(); });

    imageInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          attachedImageBase64 = event.target.result;
          imagePreview.src = attachedImageBase64;
          imagePreviewContainer.style.display = 'flex';
        };
        reader.readAsDataURL(file);
      }
    });

    removeImageBtn.addEventListener('click', () => {
      attachedImageBase64 = null;
      imageInput.value = '';
      imagePreviewContainer.style.display = 'none';
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      
      recognition.onstart = () => { 
        isVoiceInputActive = true; 
        voiceBtn.classList.add('voice-active'); 
        micIcon.innerHTML = `<rect x="6" y="6" width="12" height="12" rx="2" />`; 
        chatInput.placeholder = "Listening..."; 
      };
      
      recognition.onresult = (event) => { 
        const transcript = event.results[0][0].transcript; 
        chatInput.value = transcript; 
      };
      
      recognition.onerror = () => { resetVoiceUI(); };
      recognition.onend = () => { resetVoiceUI(); };
    }
    
    function resetVoiceUI() { 
      isVoiceInputActive = false; 
      voiceBtn.classList.remove('voice-active'); 
      micIcon.innerHTML = `<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line>`;
      chatInput.placeholder = "Message Jarvis..."; 
    }
    
    function speakText(text) {
      if (!isVoiceOutputEnabled || !('speechSynthesis' in window)) return;
      const cleanText = text.replace(/[*#`_]/g, '').replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.rate = 1.0; utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    voiceBtn.addEventListener('click', () => {
      if (isVoiceInputActive) { recognition.stop(); return; }
      if (!SpeechRecognition) { alert("Voice recognition is not supported."); return; }
      try { recognition.start(); } catch(e) {}
    });

    function addMessage(text, sender, imageUrl = null) {
      const msgDiv = document.createElement('div'); msgDiv.classList.add('message', sender);
      
      const avatarDiv = document.createElement('div'); avatarDiv.classList.add('avatar');
      
      if (sender === 'user') {
        avatarDiv.innerHTML = `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>`;
      } else {
        avatarDiv.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>`;
      }
      
      const contentDiv = document.createElement('div'); contentDiv.classList.add('message-content');
      
      if (imageUrl) {
        const img = document.createElement('img');
        img.src = imageUrl;
        img.classList.add('chat-image');
        contentDiv.appendChild(img);
      }

      const textNode = document.createElement('div');
      let formattedText = text.replace(/```([\s\S]*?)```/g, '<br><code>$1</code><br>');
      textNode.innerHTML = formattedText;
      contentDiv.appendChild(textNode);

      msgDiv.appendChild(avatarDiv); msgDiv.appendChild(contentDiv);
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function showTypingIndicator() {
      const msgDiv = document.createElement('div'); msgDiv.classList.add('message', 'ai'); msgDiv.id = 'typingIndicator';
      msgDiv.innerHTML = `
        <div class="avatar" style="background: linear-gradient(135deg, #8b5cf6, #3b82f6); box-shadow: 0 0 12px rgba(139, 92, 246, 0.4); border: 1px solid #a78bfa; color: white;">
          <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
        </div>
        <div class="message-content" style="padding: 15px 20px;"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
    
    function removeTypingIndicator() { const indicator = document.getElementById('typingIndicator'); if (indicator) indicator.remove(); }
    chatInput.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px'; });

    async function handleSend() {
      const text = chatInput.value.trim();
      if (!text && !attachedImageBase64) return;
      if (!apiKey) { alert("Please set your Groq API Key in Settings first!"); return; }

      const currentImage = attachedImageBase64;
      addMessage(text || "Here is an image.", 'user', currentImage);
      
      let messageContent = text;
      let modelToUse = "openai/gpt-oss-120b";
      let messagesPayload = [];

      if (currentImage) {
        // 🟢 নতুন ভিশন মডেল ব্যবহার
        modelToUse = "qwen/qwen3.8-27b"; 
        messageContent = [
          { type: "text", text: text || "Describe this image." },
          { type: "image_url", image_url: { url: currentImage } }
        ];
        // 🟢 ছবির ক্ষেত্রে chatHistory বাদ দেওয়া হলো
        messagesPayload = [
          { role: "system", content: "You are Jarvis, a highly intelligent AI assistant. Analyze the image carefully." },
          { role: "user", content: messageContent }
        ];
      } else {
        // 🟢 টেক্সটের ক্ষেত্রে chatHistory ব্যবহার করা হলো
        chatHistory.push({ role: "user", content: text });
        messagesPayload = [
          { role: "system", content: "You are Jarvis, a highly intelligent AI assistant. You excel at coding and writing. You are helpful, concise, and professional. Always format code clearly." },
          ...chatHistory
        ];
      }

      chatInput.value = ''; chatInput.style.height = 'auto';
      removeImageBtn.click(); 
      
      sendBtn.disabled = true; showTypingIndicator();

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
          body: JSON.stringify({
            model: modelToUse,
            messages: messagesPayload, // 🟢 ডাইনামিক পেলোড
            temperature: 0.7, 
            max_tokens: 2048
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const aiResponse = data.choices[0].message.content;
        removeTypingIndicator();
        addMessage(aiResponse, 'ai');
        
        if (!currentImage) {
          chatHistory.push({ role: "assistant", content: aiResponse });
        }
        
        speakText(aiResponse);
      } catch (error) {
        removeTypingIndicator();
        addMessage("Error: " + error.message, 'ai');
      } finally {
        sendBtn.disabled = false;
        chatInput.focus();
      }
    }

    sendBtn.addEventListener('click', handleSend);
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });
    settingsBtn.addEventListener('click', () => { apiKeyInput.value = apiKey; settingsModal.style.display = 'flex'; });
    cancelSettingsBtn.addEventListener('click', () => { settingsModal.style.display = 'none'; });
    saveSettingsBtn.addEventListener('click', () => {
      apiKey = apiKeyInput.value.trim();
      localStorage.setItem('jarvis_groq_key', apiKey);
      settingsModal.style.display = 'none';
      if(apiKey) addMessage("API Key saved successfully. I am ready to help you, Sir.", 'ai');
    });
  </script>
</body>
</html>
