<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Jarvis AI</title>
  <link rel="manifest" href="manifest-Jarvis.json">
  <meta name="theme-color" content="#0f0f15">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-color: #0f0f15;
      --surface-color: #1a1b26;
      --primary-color: #4a9eff;
      --secondary-color: #d6a1f0;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --user-msg-bg: #2a3142;
      --ai-msg-bg: #1e1e2e;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100dvh; /* 🟢 FIX: 100dvh fixes the mobile viewport issue */
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ===== Header ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      background-color: var(--bg-color);
      border-bottom: 1px solid #1f2937;
      z-index: 10;
      flex-shrink: 0; /* Prevents header from shrinking */
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(90deg, #4a9eff, #d6a1f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-buttons button {
      background: none; border: none; color: var(--text-muted);
      font-size: 20px; cursor: pointer; margin-left: 10px;
    }

    /* ===== Chat Container ===== */
    .chat-container {
      flex: 1;
      min-height: 0; /* 🟢 FIX: Essential for flexbox scrolling to work inside body */
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      gap: 15px;
      max-width: 90%;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 35px; height: 35px; border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      font-size: 18px; flex-shrink: 0;
    }

    .user .avatar { background: #3b82f6; color: white; }
    .ai .avatar { background: linear-gradient(135deg, #8b5cf6, #3b82f6); color: white; }

    .message-content {
      padding: 12px 18px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap; 
    }

    .user .message-content {
      background-color: var(--user-msg-bg);
      border-bottom-right-radius: 4px;
    }

    .ai .message-content {
      background-color: var(--ai-msg-bg);
      border: 1px solid #2a3142;
      border-bottom-left-radius: 4px;
    }

    /* Code Block Styling */
    .ai .message-content code {
      background-color: #0f1419;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      color: #00e5ff;
    }

    /* ===== Input Area ===== */
    .input-area {
      padding: 10px 15px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 15px)); /* 🟢 FIX: Keeps input above mobile navigation bar */
      background-color: var(--bg-color);
      flex-shrink: 0; /* 🟢 FIX: Prevents input area from being squeezed */
    }

    .input-box {
      background-color: var(--surface-color);
      border: 1px solid #2a3142;
      border-radius: 25px;
      padding: 8px 12px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .input-box textarea {
      flex: 1;
      background: none; border: none; color: var(--text-main);
      font-size: 15px; resize: none; max-height: 100px;
      outline: none; padding-top: 8px; line-height: 1.4;
    }

    .input-box textarea::placeholder { color: var(--text-muted); }

    .action-btn {
      background: none; border: none; color: var(--text-muted);
      font-size: 22px; cursor: pointer; padding: 5px;
      display: flex; justify-content: center; align-items: center;
      transition: all 0.2s;
      margin-bottom: 2px;
    }

    .action-btn:hover { color: var(--text-main); }

    /* Voice Mode Active State */
    .voice-active {
      color: #ff6b4a;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .send-btn {
      background: linear-gradient(135deg, #4a9eff, #2a7fdb);
      color: white; border-radius: 50%; width: 38px; height: 38px;
      display: flex; justify-content: center; align-items: center;
      font-size: 16px; border: none; cursor: pointer;
      transition: 0.2s;
      margin-bottom: 2px;
    }

    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .send-btn:hover { transform: scale(1.05); }

    /* Typing Indicator */
    .typing-dots { display: flex; gap: 4px; align-items: center; height: 20px; }
    .typing-dots span {
      width: 6px; height: 6px; background-color: var(--text-muted);
      border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both;
    }
    .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
    .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

  </style>
</head>
<body>

  <div class="header">
    <h1>✨ Jarvis AI</h1>
    <div class="header-buttons">
      <button id="settingsBtn" title="Settings">⚙️</button>
    </div>
  </div>

  <div class="chat-container" id="chatContainer">
    <!-- Messages will appear here -->
    <div class="message ai">
      <div class="avatar">🤖</div>
      <div class="message-content">
        Hello Sir. I am your new Jarvis. I can help you with Coding, Writing, and general questions. <br><br>How may I assist you today?
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-box">
      <!-- Voice Mode Toggle -->
      <button class="action-btn" id="voiceBtn" title="Toggle Voice Mode">🎙️</button>
      
      <textarea id="chatInput" rows="1" placeholder="Message Jarvis..."></textarea>
      
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(5px);">
    <div style="background: var(--surface-color); padding: 25px; border-radius: 15px; width: 100%; max-width: 400px; border: 1px solid #2a3142;">
      <h2 style="margin-bottom: 15px; color: white;">Settings</h2>
      <label style="display: block; color: var(--text-muted); margin-bottom: 5px; font-size: 14px;">Groq API Key:</label>
      <input type="password" id="apiKeyInput" placeholder="gsk_..." style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #2a3142; background: #0f1419; color: white; margin-bottom: 20px;">
      
      <div style="display: flex; gap: 10px;">
        <button id="cancelSettings" style="flex: 1; padding: 12px; border-radius: 8px; border: none; background: #2a3142; color: white; font-weight: bold; cursor: pointer;">Cancel</button>
        <button id="saveSettings" style="flex: 1; padding: 12px; border-radius: 8px; border: none; background: #4a9eff; color: white; font-weight: bold; cursor: pointer;">Save</button>
      </div>
    </div>
  </div>

  <script>
    // Elements
    const chatContainer = document.getElementById('chatContainer');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveSettingsBtn = document.getElementById('saveSettings');
    const cancelSettingsBtn = document.getElementById('cancelSettings');

    // State
    let apiKey = localStorage.getItem('jarvis_groq_key') || "";
    let isVoiceMode = false; // Set to true if you want it to always speak out loud
    let isRecording = false;
    let chatHistory = []; 
    
    // Speech Recognition (Voice Input)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'en-US'; // Change to 'bn-BD' for Bengali
      recognition.interimResults = false;

      recognition.onstart = () => {
        isRecording = true;
        voiceBtn.classList.add('voice-active');
        voiceBtn.innerText = '🛑'; 
        chatInput.placeholder = "Listening...";
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        chatInput.value = transcript;
        if (isVoiceMode) {
          handleSend();
        }
      };

      recognition.onerror = (event) => {
        console.error("Speech recognition error", event.error);
        resetVoiceUI();
      };

      recognition.onend = () => {
        resetVoiceUI();
      };
    }

    function resetVoiceUI() {
      isRecording = false;
      voiceBtn.classList.remove('voice-active');
      voiceBtn.innerText = '🎙️';
      chatInput.placeholder = "Message Jarvis...";
    }

    // Text to Speech (Voice Output)
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      
      const cleanText = text.replace(/[*#`_]/g, '').replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '');
      
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.rate = 1.0;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    // Toggle Voice Mode
    voiceBtn.addEventListener('click', () => {
      if (isRecording) {
        recognition.stop();
        return;
      }

      if (!SpeechRecognition) {
        alert("Voice recognition is not supported in this browser.");
        return;
      }

      try {
        recognition.start();
      } catch(e) {
        console.log("Already listening");
      }
    });

    // UI Functions
    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      
      const avatarDiv = document.createElement('div');
      avatarDiv.classList.add('avatar');
      avatarDiv.innerText = sender === 'user' ? '👤' : '🤖';

      const contentDiv = document.createElement('div');
      contentDiv.classList.add('message-content');
      
      let formattedText = text.replace(/```([\s\S]*?)```/g, '<br><code>$1</code><br>');
      contentDiv.innerHTML = formattedText;

      msgDiv.appendChild(avatarDiv);
      msgDiv.appendChild(contentDiv);
      chatContainer.appendChild(msgDiv);
      
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function showTypingIndicator() {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', 'ai');
      msgDiv.id = 'typingIndicator';
      msgDiv.innerHTML = `
        <div class="avatar">🤖</div>
        <div class="message-content" style="padding: 15px 20px;">
          <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>
      `;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('typingIndicator');
      if (indicator) indicator.remove();
    }

    // Auto-resize textarea
    chatInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });

    // Send Message Logic
    async function handleSend() {
      const text = chatInput.value.trim();
      if (!text) return;

      if (!apiKey) {
        alert("Please set your Groq API Key in Settings first! (Click the ⚙️ icon)");
        return;
      }

      addMessage(text, 'user');
      chatInput.value = '';
      chatInput.style.height = 'auto';
      
      chatHistory.push({ role: "user", content: text });
      
      sendBtn.disabled = true;
      showTypingIndicator();

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama3-70b-8192", 
            messages: [
              { 
                role: "system", 
                content: "You are Jarvis, a highly intelligent AI assistant. You excel at coding and writing. You are helpful, concise, and professional. Always format code clearly." 
              },
              ...chatHistory
            ],
            temperature: 0.7,
            max_tokens: 1024
          })
        });

        const data = await response.json();
        
        if (data.error) {
          throw new Error(data.error.message);
        }

        const aiResponse = data.choices[0].message.content;
        
        removeTypingIndicator();
        addMessage(aiResponse, 'ai');
        chatHistory.push({ role: "assistant", content: aiResponse });
        
        // Auto speak if user wants
        speakText(aiResponse);

      } catch (error) {
        removeTypingIndicator();
        addMessage("Error: " + error.message, 'ai');
        console.error(error);
      } finally {
        sendBtn.disabled = false;
        chatInput.focus();
      }
    }

    sendBtn.addEventListener('click', handleSend);
    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    // Settings Modal Logic
    settingsBtn.addEventListener('click', () => {
      apiKeyInput.value = apiKey;
      settingsModal.style.display = 'flex';
    });

    cancelSettingsBtn.addEventListener('click', () => {
      settingsModal.style.display = 'none';
    });

    saveSettingsBtn.addEventListener('click', () => {
      apiKey = apiKeyInput.value.trim();
      localStorage.setItem('jarvis_groq_key', apiKey);
      settingsModal.style.display = 'none';
      
      if(apiKey) {
        addMessage("API Key saved successfully. I am ready to help you, Sir.", 'ai');
      }
    });

  </script>
</body>
</html>
